    <script>
      // Safe Window proxy & error interceptor to prevent cross-origin iframe security errors (e.g. window.top.ethereum access)
      (function () {
        function createSafeWindowProxy(targetWindow) {
          try {
            return new Proxy(targetWindow, {
              get: function (target, prop, receiver) {
                try {
                  return Reflect.get(target, prop, receiver);
                } catch (e) {
                  return undefined;
                }
              },
              has: function (target, prop) {
                try {
                  return Reflect.has(target, prop);
                } catch (e) {
                  return false;
                }
              },
            });
          } catch (e) {
            return targetWindow;
          }
        }

        try {
          if (typeof window !== 'undefined') {
            if (window.parent && window.parent !== window) {
              var parentProxy = createSafeWindowProxy(window.parent);
              try {
                Object.defineProperty(window, 'parent', {
                  get: function () {
                    return parentProxy;
                  },
                  configurable: true,
                });
              } catch (e) {}
            }
            if (window.top && window.top !== window) {
              var topProxy = createSafeWindowProxy(window.top);
              try {
                Object.defineProperty(window, 'top', {
                  get: function () {
                    return topProxy;
                  },
                  configurable: true,
                });
              } catch (e) {}
            }
          }
        } catch (e) {}

        var isCrossFrameEthError = function (msg) {
          if (!msg || typeof msg !== 'string') return false;
          return (
            msg.indexOf('ethereum') !== -1 &&
            (msg.indexOf('cross-origin') !== -1 ||
              msg.indexOf('Blocked a frame') !== -1 ||
              msg.indexOf('cross-origin frame') !== -1 ||
              msg.indexOf('named property') !== -1)
          );
        };

        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var text = args
            .map(function (a) {
              return typeof a === 'string' ? a : (a && a.message) || '';
            })
            .join(' ');
          if (isCrossFrameEthError(text)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function () {
          var args = Array.prototype.slice.call(arguments);
          var text = args
            .map(function (a) {
              return typeof a === 'string' ? a : (a && a.message) || '';
            })
            .join(' ');
          if (isCrossFrameEthError(text)) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        window.onerror = function (msg, url, line, col, error) {
          var str =
            (msg || '') + ' ' + (error && error.message ? error.message : '');
          if (isCrossFrameEthError(str)) {
            return true;
          }
        };

        window.addEventListener(
          'error',
          function (event) {
            var msg =
              (event &&
                (event.message ||
                  (event.error && (event.error.message || String(event.error))))) ||
              '';
            if (isCrossFrameEthError(msg)) {
              if (typeof event.preventDefault === 'function') {
                event.preventDefault();
              }
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var msg =
              (event &&
                event.reason &&
                (event.reason.message || String(event.reason))) ||
              '';
            if (isCrossFrameEthError(msg)) {
              if (typeof event.preventDefault === 'function') {
                event.preventDefault();
              }
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
              return true;
            }
          },
          true
        );
      })();
    </script>
    <script>
      // Mencegah browser tablet/iPad melakukan zoom pada seluruh halaman saat pinch gesture
      document.addEventListener(
        'gesturestart',
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );
      document.addEventListener(
        'gesturechange',
        function (e) {
          e.preventDefault();
        },
        { passive: false }
      );
      (function () {
        try {
          var g = typeof globalThis !== 'undefined' ? globalThis : window;
          var originalFetch = g.fetch;
          if (originalFetch) {
            var currentFetch = originalFetch;
            var descriptor = {
              get: function () {
                return currentFetch;
              },
              set: function (val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true,
            };
            try {
              Object.defineProperty(g, 'fetch', descriptor);
            } catch (e) {}
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', descriptor);
              } catch (e) {}
            }
          }
        } catch (err) {}
      })();
    </script>
